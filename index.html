<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAOSHU · 个人主页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0d0f;color:#e8e6e3;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  .box{max-width:620px;width:100%;border:1px solid #2a2a2e;padding:40px}
  h1{font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#8a8a90;margin-bottom:24px;font-weight:500}
  h2{font-size:30px;letter-spacing:-.01em;margin-bottom:14px;font-weight:600}
  p{font-size:14px;line-height:1.85;color:#a8a6a3}
  .repo{margin-top:26px;padding:16px;border:1px solid #2a2a2e;background:#141416}
  .repo span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6e6c6a;margin-bottom:8px}
  code{font-family:"SF Mono",Menlo,monospace;font-size:13px;color:#d6d4d1}
  ul{margin:18px 0 0 18px;font-size:13px;line-height:2;color:#a8a6a3}
  a{color:#c9c6c1;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <h1>MAOSHU</h1>
    <h2>站点已就绪，等待你的网站文件</h2>
    <p>此页面为占位内容。将你做好的个人网站文件上传到仓库根目录后，本页面会被自动覆盖。</p>
    <div class="repo">
      <span>仓库地址</span>
      <code>https://github.com/D-kart/maoshu</code>
    </div>
    <ul>
      <li>上传方式：仓库页「Add file → Upload files」，拖拽整个网站目录</li>
      <li>首页文件名必须为 <code>index.html</code>，放在根目录</li>
      <li>已加入 <code>.nojekyll</code>，<code>_</code> 开头的目录不会被忽略</li>
      <li>上传后约 1 分钟自动生效，HTTPS 已开启</li>
    </ul>
  </div>
</body>
</html>
